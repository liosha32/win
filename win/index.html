<style>

button,.card,.p{user-select:none;-webkit-user-select:none}
html{background:#1e1e32}

.p,.b,.card{image-rendering:pixelated;text-shadow:0 1px 3px #000}
.p{background:var(--panel);border:2px solid #ffffff30;border-radius:14px;padding:12px;text-align:center}

.kp{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.kk{padding:9px 0;font-size:14px;border-radius:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.tabs .b{flex:0 0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:2px solid #ffffff40;border-radius:12px;overflow:hidden;background:#282846;display:flex;flex-direction:column;touch-action:manipulation}
.card i{height:70px;display:block;image-rendering:pixelated}
.card div{padding:6px 8px;font-size:14px}

.cw{position:relative;width:100%;aspect-ratio:1;border:4px solid #3c3c50}
.cw canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
.cw::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#0003 1px,transparent 1px),linear-gradient(90deg,#0003 1px,transparent 1px);background-size:calc(100%/32) calc(100%/32)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.sw{aspect-ratio:1;border:3px solid #505064;border-radius:6px}.sw.on{border-color:#ff0}
.pl{display:flex;justify-content:space-between;padding:6px 10px;border-radius:6px;margin-bottom:4px;font-size:14px}
#bgl{position:fixed;inset:0;z-index:0}#fx{z-index:1}#app{z-index:2}

@keyframes glw{50%{box-shadow:0 0 22px 4px #ffd700aa}}
@keyframes shn{from{background-position:0 0,0 0}to{background-position:100% 0,0 0}}
@keyframes flm{to{background-position:0 200px}}
@keyframes rbw{to{background-position:300px 0}}
@keyframes neo{from{box-shadow:0 0 4px #0ff,inset 0 0 4px #0ff;border-color:#0ff}to{box-shadow:0 0 20px #f0f,inset 0 0 10px #f0f;border-color:#f0f}}

@keyframes trn{from{background-position:0 calc(100% - 3px),0 0,0 0}to{background-position:300px calc(100% - 3px),0 0,0 0}}
@keyframes aqa{from{background-position:0 50%,0 0,0 0,0 0}to{background-position:200px 50%,0 -100px,0 0,0 0}}
@keyframes rin{from{background-position:0 0,0 0,0 100%,0 0}to{background-position:-60px 60px,-40px 40px,0 100%,0 0}}
@keyframes spc{from{background-position:0 40%,0 0,0 0,0 0}to{background-position:400px 40%,-100px 0,0 0,0 0}}
@keyframes pln{from{background-position:0 35%,0 75%,0 10%,0 0}to{background-position:360px 35%,-200px 75%,-140px 10%,0 0}}

@keyframes drf{from{background-size:160px 100px,90px 60px,100px 30px,100% 8%,auto}to{background-size:160px 100px,90px 60px,100px 30px,100% 26%,auto}}
</style>

 <div class="row" style="width:100%;align-items:center"><span>Яркость</span><input id="vv" type="range" min="0" max="100" value="100" style="flex:3;padding:0;border:0"></div>
 <div id="cur" style="width:100%;height:30px;border-radius:8px;border:2px solid #fff;background:${dc}"></div></div>
 <div class="row"><button class="b s" onclick="dt='brush'">🖌 Кисть</button><button class="b s" onclick="dt='eraser'">🧹 Ластик</button><button class="b s" onclick="dt='fill'">🪣 Залить</button><button class="b s" onclick="clr()">✕ Очистить</button></div>
 <div class="row"><button class="b s" onclick="dz=1">·</button><button class="b s" onclick="dz=2">●</button><button class="b s" onclick="dz=3">⬤</button></div>
 <div class="row"><button class="b k" onclick="saveDraw()">💾 Сохранить${free?"":" (−$1,000,000)"}</button><button class="b g" onclick="scr='shop';render()">← Отмена</button></div>`;
 const c=$("#dc");dg=c.getContext("2d");clr();let dn=0;
 const xy=e=>{const r=c.getBoundingClientRect();return[Math.max(0,Math.min(31,Math.floor((e.clientX-r.left)/r.width*32))),Math.max(0,Math.min(31,Math.floor((e.clientY-r.top)/r.height*32)))]};
 const dot=(x,y)=>{dg.fillStyle=dt=="eraser"?"#fff":dc;dg.fillRect(x,y,dz,dz)};
 let lx=-1,ly=-1;
 const pt2=e=>{const[x,y]=xy(e);if(dt=="fill"){dg.fillStyle=dc;dg.fillRect(0,0,32,32);dn=0;return}if(lx<0)dot(x,y);else{const n=Math.max(Math.abs(x-lx),Math.abs(y-ly),1);for(let i=1;i<=n;i++)dot(Math.round(lx+(x-lx)*i/n),Math.round(ly+(y-ly)*i/n))}lx=x;ly=y};
 c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);dn=1;lx=-1;pt2(e)};
 c.onpointermove=e=>{if(dn){e.preventDefault();pt2(e)}};c.onpointerup=c.onpointercancel=()=>{dn=0;lx=-1};
 c.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});c.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
 hsv=[0,0,1];const w=$("#wh");wheel();let wd=0;
 const wp=e=>{const r=w.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*220-110,y=(e.clientY-r.top)/r.height*220-110,d=Math.hypot(x,y);if(d>114)return;hsv=[((Math.atan2(y,x)/Math.PI/2)+1)%1,Math.min(1,d/110),hsv[2]];setHSV()};
 w.onpointerdown=e=>{e.preventDefault();w.setPointerCapture(e.pointerId);wd=1;wp(e)};w.onpointermove=e=>{if(wd){e.preventDefault();wp(e)}};w.onpointerup=w.onpointercancel=()=>wd=0;
 w.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});w.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
 $("#vv").oninput=e=>{hsv[2]=e.target.value/100;wheel();setHSV()}}
function h2h(hh,s,v){const f=(n,k=(n+hh*6)%6)=>v-v*s*Math.max(0,Math.min(k,4-k,1));return[f(5),f(3),f(1)].map(x=>Math.round(x*255))}
function wheel(){const w=$("#wh");if(!w)return;const g=w.getContext("2d"),R=110,im=g.createImageData(220,220);for(let y=0;y<220;y++)for(let x=0;x<220;x++){const dx=x-R,dy=y-R,r=Math.hypot(dx,dy);if(r<=R){const i=(y*220+x)*4,c=h2h(((Math.atan2(dy,dx)/Math.PI/2)+1)%1,r/R,hsv[2]);im.data[i]=c[0];im.data[i+1]=c[1];im.data[i+2]=c[2];im.data[i+3]=255}}g.putImageData(im,0,0)}
function setHSV(){dc="#"+h2h(hsv[0],hsv[1],hsv[2]).map(x=>x.toString(16).padStart(2,"0")).join("");if(dt=="eraser")dt="brush";mark()}
function mark(){document.querySelectorAll(".sw").forEach((e,i)=>e.classList.toggle("on",PAL[i]==dc));const e=$("#cur");if(e)e.style.background=dc}
function clr(){dg.fillStyle="#fff";dg.fillRect(0,0,32,32)}
function saveDraw(){if(!free&&S.bal<1e6){toast("Рисунок стоит $1,000,000, у вас "+f(S.bal));return}
 const n="Рисунок #"+(1000+ri(9000)),d=dg.canvas.toDataURL(),id=dg.getImageData(0,0,32,32).data;let r=0,g=0,b=0;
 for(let i=0;i<id.length;i+=4){r+=id[i];g+=id[i+1];b+=id[i+2]}
 const c=[~~(r/1024),~~(g/1024),~~(b/1024)];
 ITEMS[dty][n]={c,r:"mythic",p:0,img:d};S.skins.push({t:dty,n,c,d});S.owned.push(dty+":"+n);S[dty]=n;if(!free)S.bal-=1e6;
 save();apply();cat=dty;scr="shop";toast("✓ Создан «"+n+"»");render()}
function admin(){adminModal=null;amVal="";
 $("#app").innerHTML=`<div class="p big" style="color:#f66">АДМИН-ПАНЕЛЬ</div><div class="p">Баланс: ${f(S.bal)} · Долг: ${f(S.debt)}</div>
 <button class="b" onclick="aBonus()">Бонус $3,000,000</button>
 <button class="b" onclick="aDebt()">Очистить долг</button>
 <button class="b" onclick="aPred()">Предсказание: ${S.pred?"ВКЛ":"ВЫКЛ"}</button>
 <button class="b" onclick="openShop(1)">Магазин: всё бесплатно</button>
 <button class="b" onclick="S.bal+=500;save();admin()">+500</button>
 <button class="b" style="background:#2a7a5a" onclick="scr='plr';render()">👥 Игроки</button>
 <button class="b" style="background:#643c96" onclick="scr='plist';render()">📋 Промокоды</button>
 <button class="b g" onclick="scr='main';render()">Назад</button>`}
function aBonus(){const r=86400-(T()-S.tB);if(r<=0){S.bal+=3e6;S.tB=T();save();toast("Получено $3,000,000!")}else toast(`Подожди ${~~(r/3600)}ч ${~~(r%3600/60)}м`);admin()}
function aDebt(){if(S.debt>0){S.bal=Math.max(0,S.bal-S.debt);S.debt=0;save()}admin()}
function aPred(){if(S.pred){if(!S.pr)S.pred=0}else if(T()-S.tP>=300){S.pred=1;S.pr=[0,0,0].map(()=>1+ri(6));toast("Предсказание: "+S.pr.join(" "))}else toast(`Подожди ${Math.ceil((300-(T()-S.tP))/60)} мин`);save();admin()}
function plist(){const a=Object.entries(PROMO).sort((x,y)=>y[1]-x[1]);
 $("#app").innerHTML=`<div class="p big" style="color:#ffc864">📋 Промокоды</div><div class="p">Всего: ${a.length} · Использовано: ${S.used.length}</div>
 <div>${a.map(([c,v])=>{const u=S.used.includes(c);return `<div class="pl" style="background:${u?"#3c2828":"#283c28"};color:${u?"#c88":"#9d9"}"><span>${c}</span><span style="color:#ffdc64">${f(v)}</span><span>${u?"✗":"✓"}</span></div>`}).join("")}</div>
 <button class="b" onclick="scr='admin';render()">Назад</button>`}
